<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini UI Redesign</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup-container">
        <header class="popup-header">
            <div class="logo-row">
                <img class="logo-icon" src="icon.svg" alt="Gemini" width="22" height="22">
                <h1>Gemini UI</h1>
                <span class="version-badge">v0.5.0</span>
            </div>
            <p class="subtitle">Customize your Gemini experience</p>
        </header>

        <!-- Master Toggle -->
        <div class="toggle-row">
            <span class="toggle-label">Custom Backgrounds</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-backgrounds" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>

        <!-- Zen Mode Toggle -->
        <div class="toggle-row">
            <span class="toggle-label">Zen Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-zen-mode">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <!-- Glass & Glow Settings -->
        <div class="fx-section">
            <div class="fx-section-title">Glass & Glow</div>

            <div class="fx-slider-row">
                <span class="fx-label">Glass</span>
                <input type="range" id="glass-intensity" min="0" max="100" value="100" step="5">
                <span class="fx-value" id="glass-intensity-value">100%</span>
            </div>

            <div class="fx-slider-row" id="glass-blur-row">
                <span class="fx-label">Blur</span>
                <input type="range" id="glass-blur-slider" min="0" max="80" value="60" step="2">
                <span class="fx-value" id="glass-blur-value">60px</span>
            </div>

            <div class="fx-divider"></div>

            <div class="fx-slider-row">
                <span class="fx-label">Glow</span>
                <input type="range" id="glow-intensity" min="0" max="100" value="0" step="5">
                <span class="fx-value" id="glow-intensity-value">0%</span>
            </div>

            <div class="fx-color-row" id="glow-color-row">
                <span class="fx-label">Color</span>
                <div class="color-presets" id="glow-presets">
                    <button class="color-dot active" data-color="#a855f7" style="background:#a855f7" title="Purple"></button>
                    <button class="color-dot" data-color="#3b82f6" style="background:#3b82f6" title="Blue"></button>
                    <button class="color-dot" data-color="#06b6d4" style="background:#06b6d4" title="Cyan"></button>
                    <button class="color-dot" data-color="#f97316" style="background:#f97316" title="Orange"></button>
                    <button class="color-dot" data-color="#ef4444" style="background:#ef4444" title="Red"></button>
                    <button class="color-dot" data-color="#10b981" style="background:#10b981" title="Green"></button>
                    <button class="color-dot" data-color="#f5f5f5" style="background:#f5f5f5" title="White"></button>
                </div>
                <input type="color" id="glow-color-custom" value="#a855f7" class="color-custom" title="Custom color">
            </div>
        </div>

        <!-- Gradient Presets -->
        <div class="fx-section">
            <div class="fx-section-title">Gradient Presets</div>
            <div class="gradient-presets" id="gradient-presets">
                <button class="gradient-dot active" data-gradient="default" style="background: linear-gradient(135deg, #4f46e5, #c026d3, #0891b2)" title="Default"></button>
                <button class="gradient-dot" data-gradient="sunset" style="background: linear-gradient(135deg, #f97316, #ec4899, #a855f7)" title="Sunset"></button>
                <button class="gradient-dot" data-gradient="ocean" style="background: linear-gradient(135deg, #0ea5e9, #14b8a6, #22c55e)" title="Ocean"></button>
                <button class="gradient-dot" data-gradient="aurora" style="background: linear-gradient(135deg, #22c55e, #14b8a6, #3b82f6)" title="Aurora"></button>
                <button class="gradient-dot" data-gradient="neon" style="background: linear-gradient(135deg, #f43f5e, #8b5cf6, #06b6d4)" title="Neon"></button>
                <button class="gradient-dot" data-gradient="forest" style="background: linear-gradient(135deg, #166534, #15803d, #84cc16)" title="Forest"></button>
                <button class="gradient-dot" data-gradient="midnight" style="background: linear-gradient(135deg, #1e3a8a, #4c1d95, #581c87)" title="Midnight"></button>
                <button class="gradient-dot" data-gradient="dusk" style="background: linear-gradient(135deg, #7c3aed, #f472b6, #f59e0b)" title="Dusk"></button>
                <button class="gradient-dot" data-gradient="lava" style="background: linear-gradient(135deg, #b91c1c, #f97316, #facc15)" title="Lava"></button>
                <button class="gradient-dot" data-gradient="glacier" style="background: linear-gradient(135deg, #0f172a, #38bdf8, #e0f2fe)" title="Glacier"></button>
                <button class="gradient-dot" data-gradient="espresso" style="background: linear-gradient(135deg, #2f1b0c, #6b3f2a, #a9745c)" title="Espresso"></button>
                <button class="gradient-dot" data-gradient="rose" style="background: linear-gradient(135deg, #be123c, #f472b6, #fecdd3)" title="Rose"></button>
                <button class="gradient-dot" data-gradient="citrus" style="background: linear-gradient(135deg, #16a34a, #facc15, #f97316)" title="Citrus"></button>
                <button class="gradient-dot" data-gradient="storm" style="background: linear-gradient(135deg, #0f172a, #334155, #94a3b8)" title="Storm"></button>
                <button class="gradient-dot" data-gradient="ember" style="background: linear-gradient(135deg, #7f1d1d, #f43f5e, #fb7185)" title="Ember"></button>
                <button class="gradient-dot" data-gradient="void" style="background: linear-gradient(135deg, #0a0a0a, #1a1a1a, #2a2a2a)" title="Void"></button>
                <button class="gradient-dot" data-gradient="obsidian" style="background: linear-gradient(135deg, #030014, #0f0c29, #1a1a2e)" title="Obsidian"></button>
                <button class="gradient-dot" data-gradient="abyss" style="background: linear-gradient(135deg, #000428, #004e92, #001f3f)" title="Abyss"></button>
                <button class="gradient-dot" data-gradient="noir" style="background: linear-gradient(135deg, #000000, #1c1c1c, #3a3a3a)" title="Noir"></button>
                <button class="gradient-dot" data-gradient="phantom" style="background: linear-gradient(135deg, #1f1c2c, #928dab, #1f1c2c)" title="Phantom"></button>
                <button class="gradient-dot" data-gradient="shadow" style="background: linear-gradient(135deg, #232526, #414345, #232526)" title="Shadow"></button>
                <button class="gradient-dot" data-gradient="eclipse" style="background: linear-gradient(135deg, #0f0f0f, #1a1a2e, #16213e)" title="Eclipse"></button>
                <button class="gradient-dot" data-gradient="darkmatter" style="background: linear-gradient(135deg, #090909, #181818, #0d0d0d)" title="Dark Matter"></button>
                <button class="gradient-dot" data-gradient="blackhole" style="background: linear-gradient(135deg, #000000, #0a0a0a, #1a1a1a)" title="Black Hole"></button>
                <button class="gradient-dot" data-gradient="midnight-ink" style="background: linear-gradient(135deg, #0a0e27, #1a1f3a, #0f172a)" title="Midnight Ink"></button>
                <button class="gradient-dot" data-gradient="charcoal" style="background: linear-gradient(135deg, #1a1a1a, #2d2d2d, #1f1f1f)" title="Charcoal"></button>
                <button class="gradient-dot" data-gradient="deep-space" style="background: linear-gradient(135deg, #0b0d17, #151932, #1f294a)" title="Deep Space"></button>
                <button class="gradient-dot" data-gradient="smoke" style="background: linear-gradient(135deg, #141414, #2a2a2a, #1a1a1a)" title="Smoke"></button>
                <button class="gradient-dot" data-gradient="onyx" style="background: linear-gradient(135deg, #0d0d0d, #1f1f1f, #0a0a0a)" title="Onyx"></button>
                <button class="gradient-dot" data-gradient="twilight" style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e)" title="Twilight"></button>
            </div>
        </div>

        <!-- Drop Zones with individual darkness sliders -->
        <div class="zones-container" id="zones-container">

            <!-- Background Zone -->
            <div class="zone-group">
                <div class="drop-zone" data-key="bg_custom" id="zone-bg">
                    <div class="zone-preview" id="preview-bg"></div>
                    <div class="zone-overlay">
                        <svg class="upload-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                            stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                        </svg>
                        <span class="zone-label">Background</span>
                    </div>
                    <button class="zone-reset" title="Reset to default">✕</button>
                    <input type="file" accept="image/*" class="zone-input">
                </div>
                <div class="zone-slider">
                    <span class="zone-slider-label">DK</span>
                    <input type="range" class="darkness-slider" data-target="darkness_bg" min="0" max="100" value="60"
                        step="5">
                    <span class="zone-slider-value">60%</span>
                </div>
            </div>

            <!-- Sidebar Zone -->
            <div class="zone-group">
                <div class="drop-zone" data-key="sidebar_custom" id="zone-sidebar">
                    <div class="zone-preview" id="preview-sidebar"></div>
                    <div class="zone-overlay">
                        <svg class="upload-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                            stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                        </svg>
                        <span class="zone-label">Sidebar</span>
                    </div>
                    <button class="zone-reset" title="Reset to default">✕</button>
                    <input type="file" accept="image/*" class="zone-input">
                </div>
                <div class="zone-slider">
                    <span class="zone-slider-label">DK</span>
                    <input type="range" class="darkness-slider" data-target="darkness_sidebar" min="0" max="100"
                        value="60" step="5">
                    <span class="zone-slider-value">60%</span>
                </div>
            </div>

            <!-- Input Zone -->
            <div class="zone-group">
                <div class="drop-zone" data-key="input_custom" id="zone-input">
                    <div class="zone-preview" id="preview-input"></div>
                    <div class="zone-overlay">
                        <svg class="upload-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                            stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                        </svg>
                        <span class="zone-label">Input Field</span>
                    </div>
                    <button class="zone-reset" title="Reset to default">✕</button>
                    <input type="file" accept="image/*" class="zone-input">
                </div>
                <div class="zone-slider">
                    <span class="zone-slider-label">DK</span>
                    <input type="range" class="darkness-slider" data-target="darkness_input" min="0" max="100"
                        value="60" step="5">
                    <span class="zone-slider-value">60%</span>
                </div>
            </div>

            <!-- Messages Zone -->
            <div class="zone-group">
                <div class="drop-zone" data-key="msg_custom" id="zone-msg">
                    <div class="zone-preview" id="preview-msg"></div>
                    <div class="zone-overlay">
                        <svg class="upload-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                            stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                        </svg>
                        <span class="zone-label">Messages</span>
                    </div>
                    <button class="zone-reset" title="Reset to default">✕</button>
                    <input type="file" accept="image/*" class="zone-input">
                </div>
                <div class="zone-slider">
                    <span class="zone-slider-label">DK</span>
                    <input type="range" class="darkness-slider" data-target="darkness_msg" min="0" max="100" value="60"
                        step="5">
                    <span class="zone-slider-value">60%</span>
                </div>
            </div>
        </div>

        <footer class="popup-footer">
            <span>Drop images or click to upload</span>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
